schema_version: 1
# Default for the standalone runner (evals/judge_evidence.py) when --method is omitted.
# Application research uses RESEARCH_JUDGE_PROFILE (default need_components_v5); component
# profiles require exactly one need per job; changing this default would break multi-need runner jobs.
selected: need_evidence_v1_2
judges:
  need_components_v5:
    implementation: need_evidence_v1
    prompt: evidence_component_experiment_v5
    response_contract: components_v3
    max_completion_tokens: 8192
  need_components_v4:
    implementation: need_evidence_v1
    prompt: evidence_component_experiment_v4
    response_contract: components_v3
    max_completion_tokens: 8192
  need_components_v3:
    implementation: need_evidence_v1
    prompt: evidence_component_experiment_v3
    response_contract: components_v3
    max_completion_tokens: 8192
  need_components_v2:
    implementation: need_evidence_v1
    prompt: evidence_component_experiment_v2
    response_contract: components_v2
    max_completion_tokens: 8192
  need_evidence_relevance_v1:
    implementation: need_evidence_v1
    prompt: evidence_judgment_relevance_v1
    response_contract: relevance_v1
    max_completion_tokens: 8192
  need_evidence_v1:
    implementation: need_evidence_v1
    prompt: evidence_judgment_v1
  need_evidence_v1_1:
    implementation: need_evidence_v1
    prompt: evidence_judgment_v1_1
    response_contract: reconciled_v1_1
  need_evidence_v1_2:
    implementation: need_evidence_v1
    prompt: evidence_judgment_v1_2
    response_contract: compact_v1_2
    max_completion_tokens: 8192
  need_evidence_v1_3:
    implementation: need_evidence_v1
    prompt: evidence_judgment_v1_3
    response_contract: compact_v1_2
    max_completion_tokens: 8192
limits:
  max_concurrency: 3
  max_model_calls: 3
  max_input_chars: 40000
  max_completion_tokens: 4096
  effort: low
  timeout_seconds: 100
  cache_ttl_seconds: 86400
