schema_version: 1
checked_on: '2026-10-26'
sources:
  - https://dev.meta.ai/docs/models
  - https://dev.meta.ai/docs/pricing-rate-limits
# Local aliases, not API IDs. null prices mean unknown/not applicable, not free.
currency: USD
price_profiles:
  spark_standard: &spark_standard {unit: million_tokens, input: 1.25, cached_input: 0.15, output: 4.25}
  spark_contributor: &spark_contributor {unit: million_tokens, input: 0.10, cached_input: 0.002, output: 0.20}
defaults:
  model: spark_1_3
  allow_training_use: false
selection:
  status: configuration_validation_implemented_mock_only
  default_env: MODEL_DEFAULT
  precedence: [task_env, MODEL_DEFAULT, defaults.model]
  invalid_or_unavailable_model: error
  automatic_fallback: false
  task_env:
    claim_extraction: MODEL_CLAIM_EXTRACTION
    screenshot: MODEL_SCREENSHOT
    research: MODEL_RESEARCH
    judge: MODEL_JUDGE
    report: MODEL_REPORT
models:
  wonder:
    name: Muse Wonder
    api_model_id: muse-wonder-1.0
    access: meta_api
    price: {unit: million_tokens, input: 4.00, cached_input: 0.20, output: 20.00}
  wonder_full:
    name: Muse Wonder Full
    api_model_id: null
    access: muse_code_subscription_only
    price: null
  spark_open:
    name: Muse Spark Open
    api_model_id: null
    access: self_hosted_or_partner
    license: Muse Model License
    price: null
  sam_3_1:
    name: SAM 3.1
    api_model_id: sam-3.1
    access: meta_api
    output: boxes_masks
    price: {image_per_1000: 2.50, video_frame_per_1000: 0.20, minimum_video_frames: 50}
  spark_1_3:
    name: Muse Spark 1.3
    api_model_id: muse-spark-1.3
    access: meta_api
    price: *spark_standard
  spark_1_3_contributor:
    name: Muse Spark 1.3 Contributor
    api_model_id: muse-spark-1.3-contributor
    access: meta_api_select_countries
    training_use: true
    price: *spark_contributor
  voice_transcribe:
    name: Muse Voice Transcribe
    api_model_id: muse-voice-transcribe-1.0
    access: meta_api
    output: transcript
    price: {unit: audio_hour, output: 0.18}
  image_1_0:
    name: Muse Image 1.0
    api_model_id: muse-image-1.0
    access: meta_api
    output: image
    price: {unit: generated_image, output: 0.01}
  glimmer:
    name: Muse Glimmer
    api_model_id: null
    access: self_hosted
    license: Apache-2.0
    price: null
  spark_1_2:
    name: Muse Spark 1.2
    api_model_id: muse-spark-1.2
    access: meta_api
    price: *spark_standard
  spark_1_2_contributor:
    name: Muse Spark 1.2 Contributor
    api_model_id: muse-spark-1.2-contributor
    access: meta_api_select_countries
    training_use: true
    price: *spark_contributor
  spark_1_1:
    name: Muse Spark 1.1
    api_model_id: muse-spark-1.1
    access: meta_api
    price: *spark_standard
extra_costs:
  text_web_search_per_1000_queries: 2.50
#! Candidates are hypotheses, not measured winners or automatic routing.
task_candidates:
  claim_extraction: [spark_1_3, wonder]
  screenshot: [spark_1_3, wonder, spark_1_1]
  research: [spark_1_3, wonder]
  judge: [spark_1_3, wonder]
  report: [spark_1_3, wonder]
