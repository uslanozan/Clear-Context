name: Release

# A manual run, or a push to develop that changes the packaging, builds and smoke-tests the
# desktop apps and keeps them as workflow artifacts only. Pushing a v* tag also publishes the
# Docker images and creates a draft GitHub release, which stays private until published by hand.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [develop]
    paths:
      - 'packaging/**'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-15, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          # The oldest supported Ubuntu runner keeps the glibc requirement low.
          - { os: ubuntu-22.04, name: linux-x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.lock
            packaging/desktop/requirements.txt
      - name: Install
        run: |
          python -m pip install -r backend/requirements-dev.lock -r packaging/desktop/requirements.txt
          python -m pip install --no-deps -e backend
      - name: Build the desktop app
        run: python -m PyInstaller packaging/desktop/clear-context.spec --noconfirm
      - name: Smoke test
        run: python packaging/desktop/smoke_test.py "dist/Clear Context"
      - name: Package
        shell: bash
        run: |
          cp packaging/desktop/README.txt "dist/Clear Context/"
          archive="Clear-Context-${{ matrix.name }}"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "../$archive.zip" "Clear Context" > /dev/null
          else
            # tar keeps the executable permission that zip tools often drop.
            tar -czf "../$archive.tar.gz" "Clear Context"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: Clear-Context-${{ matrix.name }}
          path: Clear-Context-${{ matrix.name }}.*
          if-no-files-found: error

  extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package
        run: cd chrome-extension && zip -r ../Clear-Context-chrome-extension.zip . > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: Clear-Context-chrome-extension
          path: Clear-Context-chrome-extension.zip
          if-no-files-found: error

  docker:
    name: Docker images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          for part in api web; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/clear-context-$part"
            dockerfile=backend/Dockerfile
            [ "$part" = web ] && dockerfile=frontend/Dockerfile
            docker build -f "$dockerfile" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.version=$version" \
              -t "$image:$version" -t "$image:latest" .
            docker push "$image:$version"
            docker push "$image:latest"
          done

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, extension, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The notes start with this version's CHANGELOG section; GitHub appends the commits.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{found = index($0, "## " v) == 1} found' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version."; exit 1; }
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes \
            --notes-file notes.md --title "Clear Context $GITHUB_REF_NAME"
