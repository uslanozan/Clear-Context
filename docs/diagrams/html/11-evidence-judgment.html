<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence assessment | Clear Context</title><style>body{margin:0;padding:24px;background:#f8f7f4;color:#252c28;font:18px/1.6 'Source Sans 3',sans-serif}main{max-width:1600px;margin:auto}svg{width:100%;height:auto}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="judge-title judge-desc">
<title id="judge-title">From saved evidence to need-level assessment</title>
<desc id="judge-desc">An implemented standalone evaluation flow. Claims and needs reference V1 selection receipts and source contexts. Muse assesses evidence relations. Code validates IDs and exact quotations, resolves source offsets, derives need statuses, and stores a receipt. No evidence needs are insufficient without inference; errors stay errors. No global truth or source-trust score is produced.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#62695f"/></marker></defs>
<rect width="1600" height="900" fill="#f8f7f4"/>
<text x="50" y="75" font-family="Source Sans 3,sans-serif" font-size="36" font-weight="600" fill="#252c28" text-anchor="start"><tspan x="50" dy="0">Judge the evidence, preserve the boundaries</tspan></text>
<text x="50" y="120" font-family="Source Sans 3,sans-serif" font-size="22" font-weight="400" fill="#62695f" text-anchor="start"><tspan x="50" dy="0">Working evaluation service · Not connected to application graph or UI</tspan></text>
<g fill="none" stroke="#62695f" stroke-width="2" marker-end="url(#arrow)"><path d="M330 295H355"/><path d="M635 295H660"/><path d="M940 295H965"/><path d="M1245 295H1270"/></g><rect x="50" y="210" width="280" height="170" rx="8" fill="#f8f7f4" stroke="#62695f" stroke-width="1.5"/><text x="70" y="242" font-family="Source Sans 3,sans-serif" font-size="16" font-weight="600" fill="#252c28" text-anchor="start"><tspan x="70" dy="0">Claims + needs</tspan></text><text x="70" y="270" font-family="Source Sans 3,sans-serif" font-size="16" font-weight="400" fill="#62695f" text-anchor="start"><tspan x="70" dy="0">Explicit case and IDs</tspan><tspan x="70" dy="22">Needs stay separate</tspan></text><rect x="355" y="210" width="280" height="170" rx="8" fill="#f8f7f4" stroke="#62695f" stroke-width="1.5"/><text x="375" y="242" font-family="Source Sans 3,sans-serif" font-size="16" font-weight="600" fill="#252c28" text-anchor="start"><tspan x="375" dy="0">Saved evidence</tspan></text><text x="375" y="270" font-family="Source Sans 3,sans-serif" font-size="16" font-weight="400" fill="#62695f" text-anchor="start"><tspan x="375" dy="0">V1 receipt + context</tspan><tspan x="375" dy="22">Same source offsets</tspan></text><rect x="660" y="210" width="280" height="170" rx="8" fill="#eeede8" stroke="#a84315" stroke-width="1.5"/><text x="680" y="242" font-family="Source Sans 3,sans-serif" font-size="16" font-weight="600" fill="#252c28" text-anchor="start"><tspan x="680" dy="0">Muse assessment</tspan></text><text x="680" y="270" font-family="Source Sans 3,sans-serif" font-size="16" font-weight="400" fill="#62695f" text-anchor="start"><tspan x="680" dy="0">Relation + short quotes</tspan><tspan x="680" dy="22">Joint coverage + time</tspan></text><rect x="965" y="210" width="280" height="170" rx="8" fill="#f8f7f4" stroke="#62695f" stroke-width="1.5"/><text x="985" y="242" font-family="Source Sans 3,sans-serif" font-size="16" font-weight="600" fill="#252c28" text-anchor="start"><tspan x="985" dy="0">Code validation</tspan></text><text x="985" y="270" font-family="Source Sans 3,sans-serif" font-size="16" font-weight="400" fill="#62695f" text-anchor="start"><tspan x="985" dy="0">Need IDs + exact text</tspan><tspan x="985" dy="22">Resolve source offsets</tspan></text><rect x="1270" y="210" width="280" height="170" rx="8" fill="#f8f7f4" stroke="#62695f" stroke-width="1.5"/><text x="1290" y="242" font-family="Source Sans 3,sans-serif" font-size="16" font-weight="600" fill="#252c28" text-anchor="start"><tspan x="1290" dy="0">Need result</tspan></text><text x="1290" y="270" font-family="Source Sans 3,sans-serif" font-size="16" font-weight="400" fill="#62695f" text-anchor="start"><tspan x="1290" dy="0">Status + source links</tspan><tspan x="1290" dy="22">Saved judge receipt</tspan></text>
<text x="50" y="475" font-family="Source Sans 3,sans-serif" font-size="28" font-weight="600" fill="#252c28" text-anchor="start"><tspan x="50" dy="0">A source relation is not a global truth verdict</tspan></text>
<text x="50" y="530" font-family="Source Sans 3,sans-serif" font-size="23" font-weight="400" fill="#252c28" text-anchor="start"><tspan x="50" dy="0">Synthetic example: a source gives 8 km between city centers.</tspan><tspan x="50" dy="38">That can address distance; it does not establish urban adjacency.</tspan></text>
<text x="50" y="640" font-family="Source Sans 3,sans-serif" font-size="23" font-weight="400" fill="#a84315" text-anchor="start"><tspan x="50" dy="0">Reconcile gaps across excerpts · Record the temporal basis and its assumptions</tspan></text>
<text x="50" y="700" font-family="Source Sans 3,sans-serif" font-size="22" font-weight="400" fill="#62695f" text-anchor="start"><tspan x="50" dy="0">No selected evidence → insufficient without a model call · Invalid output → explicit error</tspan></text>
<text x="50" y="755" font-family="Source Sans 3,sans-serif" font-size="22" font-weight="400" fill="#62695f" text-anchor="start"><tspan x="50" dy="0">Publication time is not an effective period · Repeated excerpts are not independent sources</tspan></text>
<text x="50" y="825" font-family="Source Sans 3,sans-serif" font-size="20" font-weight="400" fill="#62695f" text-anchor="start"><tspan x="50" dy="0">Bounded calls · No automatic retries · Source reliability unassessed · No full-claim verdict</tspan></text>
</svg><p>Implemented code: <code>services/evidence_judgment.py</code>, <code>repositories/judgment.py</code>, and <code>schemas/evidence_judgment.py</code>. Statuses describe only supplied evidence. The example is explanatory, not a measured inference result.</p></main></body></html>
