<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared sources | Clear Context</title><style>body{margin:0;padding:24px;background:#f8f7f4;color:#252c28;font:18px/1.6 'Source Sans 3',sans-serif}main{max-width:1600px;margin:auto}svg{width:100%;height:auto}a{color:#a84315}code{font-size:15px}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="sharing-title sharing-description">
<title id="sharing-title">Two queries share a source without losing their needs</title>
